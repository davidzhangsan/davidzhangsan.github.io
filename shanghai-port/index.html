<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Shanghai Port</title>

    <script defer="" src="shanghai-port.js"></script>
    <link href="../stylesheet.css" rel="stylesheet" />
  </head>
  <body class="gallery-page">
    <header class="gallery-bar">
      <a class="gallery-back" href="../"
        ><span aria-hidden="true">←</span> Back to home</a
      >
      <h1>Shanghai Port</h1>
      <button hidden="" id="next-photo" type="button">
        Another photo <span aria-hidden="true">↗</span>
      </button>
    </header>
    <main aria-label="Shanghai Port photos" class="gallery-main">
      <img
        alt="Shanghai Port photo"
        fetchpriority="high"
        id="shanghai-port-photo"
      />
      <noscript>
        <style>
          #shanghai-port-photo {
            display: none;
          }
        </style>
        <img
          alt="Shanghai Port players greeting a stadium full of supporters in red."
          src="../images/shanghai-port/01-players-and-fans.jpg"
        />
      </noscript>
    </main>
  </body>
</html>
