<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Soccer</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #0e0e0e; }
      body { display: grid; place-items: center; }
      img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100vh; max-height: 100dvh; }
    </style>
    <script src="soccer.js" defer></script>
  </head>
  <body>
    <img id="soccer-photo" alt="Soccer photo" fetchpriority="high">
    <noscript>
      <style>#soccer-photo { display: none; }</style>
      <img src="../images/soccer/01-indoor.jpg" alt="A player running on an indoor soccer pitch.">
    </noscript>
  </body>
</html>
