<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Soccer</title>

    <script defer="" src="soccer.js"></script>
    <link href="../stylesheet.css" rel="stylesheet" />
  </head>
  <body class="gallery-page">
    <header class="gallery-bar">
      <a class="gallery-back" href="../"
        ><span aria-hidden="true">←</span> Back to home</a
      >
      <h1>Soccer</h1>
      <button hidden="" id="next-photo" type="button">
        Another photo <span aria-hidden="true">↗</span>
      </button>
    </header>
    <main aria-label="Soccer photos" class="gallery-main">
      <img alt="Soccer photo" fetchpriority="high" id="soccer-photo" />
      <noscript>
        <style>
          #soccer-photo {
            display: none;
          }
        </style>
        <img
          alt="A player running on an indoor soccer pitch."
          src="../images/soccer/01-indoor.jpg"
        />
      </noscript>
    </main>
  </body>
</html>
